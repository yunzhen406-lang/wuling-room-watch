name: 武陵空房偵測

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘 (GitHub 排程偶爾會延遲幾分鐘)
  workflow_dispatch:
    inputs:
      test_email:
        description: "寄一封測試信"
        type: boolean
        default: false

concurrency:
  group: wuling-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 讀取上次通知紀錄
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: wuling-state-${{ github.run_id }}
          restore-keys: wuling-state-

      - name: 查詢空房
        env:
          START_DATE: "2027-02-13"
          END_DATE: "2027-03-01"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python3 check_rooms.py --test-email
          else
            python3 check_rooms.py
          fi

      - name: 儲存通知紀錄
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: wuling-state-${{ github.run_id }}
